name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libssl-dev libdbus-1-dev libkrb5-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install toolchains and frontend dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          pnpm build
          pnpm test
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui
      - name: Check engine and desktop
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --features custom-protocol --locked -- -D warnings
          cargo test -p portstead-core --locked
          cargo build -p portstead --features custom-protocol --locked
