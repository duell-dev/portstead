[package]
name = "portstead-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = "0.9"
tempfile = "3"
dirs = "6"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.5", features = ["server", "transport-io"] }
psrp-rs = "2.0"
winrm-rs = { version = "1.2", features = ["kerberos"] }
ironrdp = { version = "0.17", features = ["connector", "session", "graphics"] }
ironrdp-blocking = "0.10"
ironrdp-tls = { version = "0.2", features = ["rustls-ring"] }
sspi = { version = "0.21", default-features = false, features = ["network_client", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
serde_yaml_ng = "0.10"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
x509-cert = "0.2"
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
